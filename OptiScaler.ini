; OFXR 0.3.3 nightly v994 - stock OptiScaler nightly-20261112.
; Copy next to the GAME executable, replacing OptiScaler.ini (not the OFXR INI).
; Install the complete official OptiScaler package and use winmm.dll.
; First open OptiScaler's menu and select FSR 3.1 BY NAME.
; UpscalerIndex is GPU/driver-dependent: auto is NOT a fixed FSR 3.1 choice.
; After testing FSR 3.1, try FSR 4 if offered for your GPU/driver.

[Upscalers]
Dx12Upscaler=ffx

[Inputs]
EnableDlssInputs=true
; Native FFX input interception OFF does not disable FSR upscaling.
EnableFfxInputs=false

[FrameGen]
Enabled=false
FGInput=nofg
FGOutput=nofg

[FSR]
UpscalerIndex=auto

[CAS]
Enabled=false

[OutputScaling]
Enabled=false

[Spoofing]
; Upstream auto enables DXGI spoofing on AMD/Intel, disables it on NVIDIA.
Dxgi=auto
StreamlineSpoofing=true

[Log]
LogToFile=true
LogLevel=2
